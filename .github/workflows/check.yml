name: Verify SeeNav four-GPU SRGPO and OPSD boundary
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python reproduce.py fetch
      - run: python reproduce.py check
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install filelock numpy
      - run: python -m unittest discover -s tests -v
      - run: python final_eval.py plan --format tags
      - name: Check Bash syntax of the actual launcher
        run: python -c 'import reproduce as r, run_alignment as a; print(a.effective_launcher((r.DEFAULT_SOURCE / r.LOCK["train_launcher"]).read_text()))' | bash -n
